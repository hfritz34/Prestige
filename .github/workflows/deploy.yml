name: Deploy to Azure

on:
  push:
    branches: [ main ]

env:
  AZURE_WEBAPP_NAME_API: 'prestigeapi'
  AZURE_WEBAPP_NAME_WEB: 'PrestigeWeb'
  DOTNET_VERSION: '9.0.x'
  NODE_VERSION: '20.14.0'

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      web: ${{ steps.filter.outputs.web }}
      api: ${{ steps.filter.outputs.api }}
    steps:
    - uses: actions/checkout@v4
    - uses: dorny/paths-filter@v3
      id: filter
      with:
        filters: |
          web:
            - 'Prestige.Web/src/pages/landing/**'
            - 'Prestige.Web/package.json'
            - 'Prestige.Web/vite.config.ts'
            - 'Prestige.Web/web.config'
            - 'Prestige.Web/landing.html'
            - 'Prestige.Web/src/landing.tsx'
            - '.github/workflows/deploy.yml'
          api:
            - 'Prestige.Api/**'
            - '.github/workflows/deploy.yml'
  build-and-deploy-api:
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}
    
    - name: Restore dependencies
      run: dotnet restore
      
    - name: Build API
      run: dotnet build Prestige.Api/*.csproj --configuration Release --no-restore
      
    - name: Publish API
      run: dotnet publish Prestige.Api/*.csproj --configuration Release --no-build --output ./api-publish
      
    - name: Azure Login (API) with OIDC if IDs provided
      if: ${{ secrets.AZURE_CLIENT_ID != '' && secrets.AZURE_TENANT_ID != '' && secrets.AZURE_SUBSCRIPTION_ID != '' }}
      uses: azure/login@v2
      with:
        client-id: ${{ secrets.AZURE_CLIENT_ID }}
        tenant-id: ${{ secrets.AZURE_TENANT_ID }}
        subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

    - name: Azure Login (API) if credentials provided
      if: ${{ secrets.AZURE_CREDENTIALS != '' }}
      uses: azure/login@v2
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}

    - name: Deploy API via publish profile
      if: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE_API != '' }}
      uses: azure/webapps-deploy@v3
      with:
        app-name: ${{ env.AZURE_WEBAPP_NAME_API }}
        publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE_API }}
        package: ./api-publish

    - name: Deploy API using az login
      if: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE_API == '' && (secrets.AZURE_CREDENTIALS != '' || (secrets.AZURE_CLIENT_ID != '' && secrets.AZURE_TENANT_ID != '' && secrets.AZURE_SUBSCRIPTION_ID != '')) }}
      uses: azure/webapps-deploy@v3
      with:
        app-name: ${{ env.AZURE_WEBAPP_NAME_API }}
        package: ./api-publish

  build-and-deploy-web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'yarn'
        cache-dependency-path: ./Prestige.Web/yarn.lock
        
    - name: Enable Corepack
      run: corepack enable
      
    - name: Install dependencies
      run: yarn install --frozen-lockfile
      working-directory: ./Prestige.Web
      
    - name: Build landing page only
      run: yarn build:landing
      working-directory: ./Prestige.Web
      
    - name: Azure Login (Web) with OIDC if IDs provided
      if: ${{ secrets.AZURE_CLIENT_ID != '' && secrets.AZURE_TENANT_ID != '' && secrets.AZURE_SUBSCRIPTION_ID != '' }}
      uses: azure/login@v2
      with:
        client-id: ${{ secrets.AZURE_CLIENT_ID }}
        tenant-id: ${{ secrets.AZURE_TENANT_ID }}
        subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

    - name: Azure Login (Web) if credentials provided
      if: ${{ secrets.AZURE_CREDENTIALS != '' }}
      uses: azure/login@v2
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}

    - name: Deploy Web via publish profile
      if: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE_WEB != '' }}
      uses: azure/webapps-deploy@v3
      with:
        app-name: ${{ env.AZURE_WEBAPP_NAME_WEB }}
        publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE_WEB }}
        package: ./Prestige.Web/dist

    - name: Deploy Web using az login
      if: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE_WEB == '' && (secrets.AZURE_CREDENTIALS != '' || (secrets.AZURE_CLIENT_ID != '' && secrets.AZURE_TENANT_ID != '' && secrets.AZURE_SUBSCRIPTION_ID != '')) }}
      uses: azure/webapps-deploy@v3
      with:
        app-name: ${{ env.AZURE_WEBAPP_NAME_WEB }}
        package: ./Prestige.Web/dist