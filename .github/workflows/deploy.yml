name: Deploy to Azure

on:
  push:
    branches: [ main ]

env:
  AZURE_WEBAPP_NAME_API: 'prestigeapi'
  DOTNET_VERSION: '9.0.x'

jobs:
  build-and-deploy-api:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}
    
    - name: Restore dependencies
      run: dotnet restore
      
    - name: Build API
      run: dotnet build Prestige.Api/*.csproj --configuration Release --no-restore
      
    - name: Publish API
      run: dotnet publish Prestige.Api/*.csproj --configuration Release --no-build --output ./api-publish
      
    - name: Deploy to Azure App Service
      uses: azure/webapps-deploy@v3
      with:
        app-name: ${{ env.AZURE_WEBAPP_NAME_API }}
        publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE_API }}
        package: ./api-publish 