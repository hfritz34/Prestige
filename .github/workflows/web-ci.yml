name: Web CI

on:
  push:
    branches: [ "*" ]
    paths:
      - 'Prestige.Web/**'
      - '.github/workflows/web-ci.yml'
  pull_request:
    branches: [ "*" ]
    paths:
      - 'Prestige.Web/**'
      - '.github/workflows/web-ci.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.14.0'
        
    - name: Enable Corepack
      run: corepack enable
        
    - name: Install dependencies
      run: yarn install
      working-directory: ./Prestige.Web
      
    - name: Build application
      run: yarn build
      working-directory: ./Prestige.Web 